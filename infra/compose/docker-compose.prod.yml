# Self-hosted / single-VPS production topology (Phase 2+).
# Secrets come from an .env file generated by the installer script (see docs/plan/15-devops-infra.md).
name: mexa

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ../deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

  api:
    image: ghcr.io/mexa/api:${MEXA_TAG:-edge}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # local-docker computer provider

  worker:
    image: ghcr.io/mexa/worker:${MEXA_TAG:-edge}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    image: ghcr.io/mexa/web:${MEXA_TAG:-edge}
    restart: unless-stopped
    env_file: .env

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mexa}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mexa}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
