# Local development dependencies for Mexa Bots.
# Usage: pnpm infra:up  /  pnpm infra:down
name: mexa-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mexa-postgres
    environment:
      POSTGRES_USER: mexa
      POSTGRES_PASSWORD: mexa
      POSTGRES_DB: mexa
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mexa -d mexa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mexa-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data

  minio:
    image: minio/minio:latest
    container_name: mexa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mexa
      MINIO_ROOT_PASSWORD: mexa-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: mexa-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
